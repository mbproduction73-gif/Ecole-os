services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
# Pour PostgreSQL : ajoutez un service db (image postgres:16) et
# DATABASE_URL=postgresql+psycopg://user:pass@db:5432/ecomos (+ psycopg[binary] dans requirements.txt)
